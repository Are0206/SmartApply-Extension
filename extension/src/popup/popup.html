<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartApply</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      width: 320px;
      background: #f8f9fa;
      color: #212529;
    }
    header {
      background: #4361ee;
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 18px; font-weight: 700; }
    .badge {
      font-size: 11px;
      background: rgba(255,255,255,0.25);
      padding: 2px 8px;
      border-radius: 10px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid #dee2e6;
    }
    .toggle-label { font-size: 14px; font-weight: 500; }
    .toggle {
      position: relative;
      width: 42px;
      height: 24px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #ced4da;
      border-radius: 24px;
      transition: .3s;
    }
    .slider:before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: .3s;
    }
    input:checked + .slider { background: #4361ee; }
    input:checked + .slider:before { transform: translateX(18px); }
    .section { padding: 12px 16px; background: white; margin-top: 8px; }
    .section h2 { font-size: 13px; text-transform: uppercase; color: #6c757d; margin-bottom: 10px; letter-spacing: .5px; }
    .profile-info { font-size: 14px; }
    .profile-info p { padding: 4px 0; }
    .profile-info span { font-weight: 600; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .9; }
    .btn-primary { background: #4361ee; color: white; }
    .btn-secondary { background: #e9ecef; color: #495057; }
    .btn-danger { background: #dc3545; color: white; }
    .status-bar {
      padding: 8px 16px;
      font-size: 12px;
      text-align: center;
      color: #6c757d;
      background: white;
      margin-top: 8px;
    }
    .status-bar.offline { color: #fd7e14; background: #fff3cd; }
    .status-bar.error { color: #dc3545; background: #f8d7da; }
    #notification {
      display: none;
      margin: 8px 16px 0;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    #notification.success { background: #d1e7dd; color: #0f5132; display: block; }
    #notification.error { background: #f8d7da; color: #842029; display: block; }
  </style>
</head>
<body>
  <header>
    <h1>SmartApply</h1>
    <span class="badge" id="status-badge">Cargando…</span>
  </header>

  <div class="toggle-row">
    <span class="toggle-label">Autocompletar activo</span>
    <label class="toggle">
      <input type="checkbox" id="toggle-enabled" />
      <span class="slider"></span>
    </label>
  </div>

  <div id="notification"></div>

  <div class="section">
    <h2>Perfil activo</h2>
    <div class="profile-info" id="profile-info">
      <p>Cargando perfil…</p>
    </div>
    <button class="btn btn-primary" id="btn-autofill">Autocompletar ahora</button>
    <button class="btn btn-secondary" id="btn-sync">↻ Sincronizar perfil</button>
  </div>

  <div class="status-bar" id="connection-status">Conectando con la API…</div>

  <script src="popup.js"></script>
</body>
</html>
