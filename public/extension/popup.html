<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SmartApply</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 340px; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    .header { background: #1e293b; padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 10px; }
    .logo { width: 28px; height: 28px; background: #38bdf8; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #0f172a; font-weight: bold; font-size: 12px; }
    .header h1 { font-size: 15px; }
    .header p { font-size: 10px; color: #94a3b8; }
    .content { padding: 12px 16px; }
    .status { display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; margin-bottom: 10px; font-size: 12px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #38bdf8; }
    .dot.off { background: #ef4444; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    .card h3 { font-size: 12px; color: #38bdf8; margin-bottom: 6px; }
    .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 11px; border-bottom: 1px solid #1e293b; }
    .row .lbl { color: #94a3b8; }
    .row .val { color: #e2e8f0; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .url-input { width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 5px 8px; color: #e2e8f0; font-size: 11px; font-family: monospace; margin: 6px 0 10px; }
    .btn { width: 100%; padding: 8px; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; margin-bottom: 6px; }
    .btn-fill { background: #38bdf8; color: #0f172a; }
    .btn-prev { background: transparent; color: #38bdf8; border: 1px solid #38bdf8; }
    .btn:hover { opacity: 0.9; }
    #log { max-height: 80px; overflow-y: auto; font-size: 10px; color: #94a3b8; margin-top: 6px; padding: 6px; background: #1e293b; border-radius: 4px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">SA</div>
    <div><h1>SmartApply</h1><p>Extension v1.0</p></div>
  </div>
  <div class="content">
    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="statusTxt">Conectando...</span>
    </div>

    <label style="font-size:11px;color:#94a3b8;">URL del Backend:</label>
    <input class="url-input" type="text" id="apiUrl" value="http://localhost:3000" />

    <div class="card" id="profileCard">
      <h3>Perfil Cargado</h3>
      <div id="profileFields"><p style="font-size:11px;color:#94a3b8;">Cargando...</p></div>
    </div>

    <button class="btn btn-prev" onclick="handlePreview()">Previsualizar</button>
    <button class="btn btn-fill" onclick="handleAutofill()">Autocompletar</button>

    <div id="log"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
